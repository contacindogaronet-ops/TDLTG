name: CI Code Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify Submodules Integrity
        run: |
          git submodule status
          if [ -z "$(ls -A jni/libtgvoip 2>/dev/null || ls -A .)" ]; then
            echo "Error: Submodules are empty or missing!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Dry-Run & Lint Check
        run: |
          ./gradlew check --dry-run --no-daemon
          ./gradlew lintDebug --no-daemon
